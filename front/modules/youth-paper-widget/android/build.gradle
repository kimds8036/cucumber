plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.youthpaperwidget'
version = '1.0.0'

android {
  namespace "expo.modules.youthpaperwidget"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  implementation "androidx.work:work-runtime-ktx:2.9.1"
}
