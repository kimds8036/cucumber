name: PR Branch Scope Check

# 브랜치 워크플로우 정합성을 PR 단계에서 강제한다.
#  [develop 으로 오는 PR]
#    - feat/back-*    → back/ 만 수정 가능
#    - feat/front-*   → front/ 만 수정 가능
#  [production / main 으로 오는 PR]
#    - 반드시 develop 브랜치에서만 와야 한다 (핫픽스도 일단 develop 거쳐서 올림)

on:
  pull_request:
    branches: [develop, production, main]

jobs:
  check-scope:
    if: github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 변경된 파일 폴더 분류
        id: changed
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.pull_request.base.ref }}
          filters: |
            back:
              - 'back/**'
            front:
              - 'front/**'

      - name: feat/back-* 브랜치가 front/ 를 건드렸는지 검사
        if: |
          startsWith(github.head_ref, 'feat/back-') &&
          steps.changed.outputs.front == 'true'
        run: |
          echo "::error::feat/back-* 브랜치는 front/ 폴더를 수정할 수 없습니다. 의도한 변경이라면 별도 PR 로 분리하거나 chore 브랜치명을 사용하세요."
          exit 1

      - name: feat/front-* 브랜치가 back/ 를 건드렸는지 검사
        if: |
          startsWith(github.head_ref, 'feat/front-') &&
          steps.changed.outputs.back == 'true'
        run: |
          echo "::error::feat/front-* 브랜치는 back/ 폴더를 수정할 수 없습니다. 의도한 변경이라면 별도 PR 로 분리하거나 chore 브랜치명을 사용하세요."
          exit 1

      - name: 검사 통과 (정상)
        if: success()
        run: echo "Branch scope check passed."

  protect-release:
    # production / main 보호: develop 외 브랜치에서 PR 못 만들게 막는다.
    if: |
      github.event.pull_request.base.ref == 'production' ||
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: develop 외 브랜치에서 production/main 으로의 PR 차단
        if: github.head_ref != 'develop'
        run: |
          echo "::error::${{ github.event.pull_request.base.ref }} 브랜치는 develop 에서만 PR 을 받을 수 있습니다. (현재 head: ${{ github.head_ref }})"
          exit 1

      - name: develop → ${{ github.event.pull_request.base.ref }} PR 통과
        if: github.head_ref == 'develop'
        run: echo "Release PR (develop → ${{ github.event.pull_request.base.ref }}) check passed."
