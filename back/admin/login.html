<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Focux Admin Login</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 40px; max-width: 480px; }
    h2 { margin-bottom: 8px; }
    .hint { color: #666; font-size: 14px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; margin: 12px 0 6px; color: #333; }
    input, select { width: 100%; height: 40px; padding: 0 10px; box-sizing: border-box; }
    button { margin-top: 16px; height: 42px; padding: 0 20px; cursor: pointer; }
    #qr-wrap { display: none; margin-top: 16px; text-align: center; }
    #qr-wrap img { max-width: 220px; border: 1px solid #ddd; border-radius: 8px; }
    #otp-setup-block, #otp-login-block { display: none; }
    .error { color: #a32d2d; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>Focux 관리자 로그인</h2>
  <p class="hint">환경을 선택한 뒤 ID·비밀번호·OTP(6자리)로 로그인합니다.</p>

  <label for="env">환경</label>
  <select id="env">
    <option value="production">Production</option>
    <option value="develop">Develop</option>
  </select>

  <form id="admin-login-form">
    <label for="username">아이디</label>
    <input id="username" name="username" required autocomplete="username" />

    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" required autocomplete="current-password" />

    <div id="otp-login-block">
      <label for="otpCode">Google OTP (6자리)</label>
      <input id="otpCode" name="otpCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" />
    </div>

    <div id="otp-setup-block">
      <p class="hint">최초 1회: 아래 QR을 Google OTP 앱에 등록한 뒤, 앱에 표시된 6자리를 입력하세요.</p>
      <div id="qr-wrap"><img id="qr-image" alt="OTP QR" /></div>
      <label for="setupOtpCode">OTP 등록 확인 (6자리)</label>
      <input id="setupOtpCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" />
    </div>

    <button type="submit" id="submit-btn">로그인</button>
    <div class="error" id="error-msg"></div>
  </form>

  <script>
    const HOSTS = {
      production: 'https://cucumber-production.up.railway.app',
      develop: 'https://cucumber-develop.up.railway.app',
    };

    const envSelect = document.getElementById('env');
    const form = document.getElementById('admin-login-form');
    const otpLoginBlock = document.getElementById('otp-login-block');
    const otpSetupBlock = document.getElementById('otp-setup-block');
    const qrWrap = document.getElementById('qr-wrap');
    const errorMsg = document.getElementById('error-msg');
    let setupToken = null;
    let phase = 'password';

    function getEnv() {
      return envSelect.value || 'production';
    }

    function getHost() {
      return HOSTS[getEnv()] || HOSTS.production;
    }

    function tokenKey() {
      return `adminToken_${getEnv()}`;
    }

    const savedEnv = localStorage.getItem('adminEnv');
    if (savedEnv && HOSTS[savedEnv]) envSelect.value = savedEnv;

    envSelect.addEventListener('change', () => {
      localStorage.setItem('adminEnv', getEnv());
      resetPhase();
    });

    function resetPhase() {
      phase = 'password';
      setupToken = null;
      otpLoginBlock.style.display = 'none';
      otpSetupBlock.style.display = 'none';
      qrWrap.style.display = 'none';
      errorMsg.textContent = '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const otpCode = document.getElementById('otpCode').value.trim();
      const setupOtpCode = document.getElementById('setupOtpCode').value.trim();

      const body = { username, password };
      if (phase === 'otp') body.otpCode = otpCode;
      if (phase === 'setup') {
        body.setupToken = setupToken;
        body.setupOtpCode = setupOtpCode;
      }

      document.getElementById('submit-btn').disabled = true;
      try {
        const res = await fetch(`${getHost()}/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));

        if (data?.success && data?.token) {
          sessionStorage.setItem(tokenKey(), data.token);
          localStorage.setItem('adminEnv', getEnv());
          window.location.href = '/admin';
          return;
        }

        if (data?.phase === 'otp_required') {
          phase = 'otp';
          otpLoginBlock.style.display = 'block';
          otpSetupBlock.style.display = 'none';
          errorMsg.textContent = data.message || 'OTP 6자리를 입력해 주세요.';
          return;
        }

        if (data?.phase === 'setup' && data?.qrDataUrl) {
          phase = 'setup';
          setupToken = data.setupToken;
          otpSetupBlock.style.display = 'block';
          otpLoginBlock.style.display = 'none';
          qrWrap.style.display = 'block';
          document.getElementById('qr-image').src = data.qrDataUrl;
          errorMsg.textContent = data.message || 'QR 등록 후 OTP를 입력하세요.';
          return;
        }

        errorMsg.textContent = data?.message || '로그인에 실패했습니다.';
      } catch (err) {
        errorMsg.textContent = '로그인 요청 중 오류가 발생했습니다. CORS·네트워크를 확인하세요.';
      } finally {
        document.getElementById('submit-btn').disabled = false;
      }
    });
  </script>
</body>
</html>
