<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouthPaper Admin Login</title>
  <link rel="stylesheet" href="{{ADMIN_BASE}}/assets/css/login.css" />
  <script>window.__ADMIN_BASE__ = {{ADMIN_BASE_JSON}}; window.__ADMIN_DEPLOY_ENV__ = {{DEPLOY_ENV_JSON}};</script>
</head>
<body>
  <div class="login-header">
    <span class="env-badge env-badge-{{DEPLOY_ENV}}" id="deploy-env-badge">{{DEPLOY_ENV_LABEL}}</span>
    <h2>YouthPaper 관리자 로그인</h2>
  </div>
  <p class="hint">ID·비밀번호·OTP(6자리)로 로그인합니다. 이 서버 환경에 고정됩니다.</p>

  <form id="admin-login-form">
    <label for="username">아이디</label>
    <input id="username" name="username" required autocomplete="username" />

    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" required autocomplete="current-password" />

    <div id="otp-login-block">
      <label for="otpCode">Google OTP (6자리)</label>
      <input id="otpCode" name="otpCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" />
    </div>

    <div id="otp-setup-block">
      <p class="hint">최초 1회: 아래 QR을 Google OTP 앱에 등록한 뒤, 앱에 표시된 6자리를 입력하세요.</p>
      <div id="qr-wrap"><img id="qr-image" alt="OTP QR" /></div>
      <label for="setupOtpCode">OTP 등록 확인 (6자리)</label>
      <input id="setupOtpCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" />
    </div>

    <button type="submit" id="submit-btn">로그인</button>
    <div class="error" id="error-msg"></div>
  </form>

  <script src="{{ADMIN_BASE}}/assets/js/login.js"></script>
</body>
</html>
