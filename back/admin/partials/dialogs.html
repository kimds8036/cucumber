<div class="dialog-backdrop" id="student-id-reject-dialog" onclick="closeStudentIdRejectByBackdrop(event)">
  <div class="dialog">
    <div class="dialog-title">학생증 거절 사유</div>
    <select id="student-id-reject-reason" style="width:100%;height:36px;margin-bottom:8px;">
      <option value="학생증 사진이 흐리거나 잘린 경우">학생증 사진이 흐리거나 잘린 경우</option>
      <option value="이름이 일치하지 않음">이름이 일치하지 않음</option>
      <option value="학교 정보가 일치하지 않음">학교 정보가 일치하지 않음</option>
      <option value="학생증이 아닌 사진">학생증이 아닌 사진</option>
      <option value="custom">기타 (직접 입력)</option>
    </select>
    <textarea class="note-input" id="student-id-reject-custom" placeholder="기타 사유를 입력하세요" style="display:none;"></textarea>
    <div class="dialog-actions">
      <button class="btn btn-sm" onclick="closeStudentIdRejectDialog()">취소</button>
      <button class="btn btn-sm btn-danger" onclick="submitStudentIdReject()">거절</button>
    </div>
  </div>
</div>

</div>
